[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # Only non-secret paths, origins, mode/store names, and the development user ID.
  # Keep scanning enabled for database URLs, client secrets, and signing keys.
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_PATH,DEV_USER_ID,UPLOAD_DIR,APP_ORIGIN,AUTH_URL,AUTH_MODE,STORAGE_DRIVER,BLOB_STORE_NAME"
